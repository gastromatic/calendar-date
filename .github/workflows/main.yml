name: Main
on:
  push:
    branches:
      - main

jobs:
  commit-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Commit Lint
        uses: wagoid/commitlint-github-action@v6
  code-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format
        run: bun run format
      - name: Lint
        run: bun run lint
  test-with-node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ 22, 24, 26 ]
    steps:
      - uses: actions/checkout@v6
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Setup Node.js environment
        uses: actions/setup-node@v6.3.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run Tests
        run: bun run test
      - name: Run Tests with different timezones
        run: bun run test:with-different-timezones
      - name: Run Tests with coverage
        run: bun run test:coverage
      - name: Post coverage results to coveralls
        uses: coverallsapp/github-action@master
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          flag-name: run-with-node-version-${{ matrix.node-version }}
          parallel: true
  complete-coverage-results:
    needs: test-with-node
    runs-on: ubuntu-latest
    steps:
      - name: Finish coveralls parallel build
        uses: coverallsapp/github-action@master
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true
  test-with-bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run Tests
        run: bun --bun run test
      - name: Run Tests with different timezones
        run: bun --bun run test:with-different-timezones
  release:
    if: "!contains(github.event.commits[0].message, '[skip ci]')"
    needs: [commit-lint, code-lint, test-with-node, test-with-bun]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm trusted publishing
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Setup Node.js environment
        uses: actions/setup-node@v6.3.0
        with:
          node-version: '22'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      - name: Disable protection temporary
        uses: actions/github-script@v9.0.0
        with:
          github-token: '${{ secrets.GASTROBOT_TOKEN}}'
          script: |
            await github.rest.repos.deleteAdminBranchProtection({
              repo: '${{ github.event.repository.name }}',
              owner: '${{ github.repository_owner }}',
              branch: 'main',
            });
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GASTROBOT_TOKEN }}
      - name: Restore protection
        uses: actions/github-script@v9.0.0
        if: always()
        with:
          github-token: '${{ secrets.GASTROBOT_TOKEN}}'
          script: |
            await github.rest.repos.setAdminBranchProtection({
              repo: '${{ github.event.repository.name }}',
              owner: '${{ github.repository_owner }}',
              branch: 'main',
            });
